<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Armador DTF</title>
<link rel="stylesheet" href="style.css">
<style>
  body { align-items: center; justify-content: center; overflow: auto; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: 34px 30px;
    width: min(360px, 90vw);
    text-align: center;
  }
  .card .mark { display: block; color: var(--accent); width: 34px; height: 34px; margin: 0 auto 14px; }
  .card .mark svg { width: 100%; height: 100%; }
  .card h1 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  #pin {
    width: 100%;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 15px;
    font-size: 26px;
    text-align: center;
    letter-spacing: 8px;
    font-family: inherit;
    margin-bottom: 16px;
  }
  #entrar { width: 100%; padding: 13px; font-size: 14px; justify-content: center; }
  #err { color: var(--danger); font-size: 12.5px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="currentColor"/><rect x="13" y="3" width="8" height="5" rx="2.5" fill="currentColor" opacity=".45"/><rect x="13" y="10" width="8" height="11" rx="2.5" fill="currentColor" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="currentColor" opacity=".25"/></svg>
    </span>
    <h1>Armador DTF</h1>
    <p>Escribe el PIN para entrar</p>
    <input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="••••••" autofocus>
    <button id="entrar" class="primary">Entrar</button>
    <div id="err"></div>
  </div>
<script>
  const pin = document.getElementById("pin");
  const btn = document.getElementById("entrar");
  const err = document.getElementById("err");

  async function entrar() {
    const v = pin.value.trim();
    if (!v) { pin.focus(); return; }
    btn.disabled = true;
    err.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: v }),
      });
      const d = await r.json();
      if (d.ok) { location.href = "/"; return; }
      err.textContent = d.error || "No se pudo entrar";
      pin.value = ""; pin.focus();
    } catch (e) {
      err.textContent = "Sin conexión con el programa";
    } finally {
      btn.disabled = false;
    }
  }
  btn.onclick = entrar;
  pin.addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
  pin.addEventListener("input", () => { if (pin.value.length === 6) entrar(); });
</script>
</body>
</html>
