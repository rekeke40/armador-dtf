<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Armador DTF</title>
<link rel="stylesheet" href="style.css">
<style>
  body { align-items: center; justify-content: center; overflow: auto; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 30px;
    width: min(360px, 90vw);
    text-align: center;
  }
  .card h1 { font-size: 20px; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #pin {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 26px;
    text-align: center;
    letter-spacing: 8px;
    font-family: inherit;
    margin-bottom: 14px;
  }
  #pin:focus { outline: none; border-color: var(--accent); }
  #entrar { width: 100%; padding: 13px; font-size: 15px; }
  #err { color: #ff8a8a; font-size: 13px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎽 Armador DTF</h1>
    <p>Escribe el PIN para entrar</p>
    <input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="••••••" autofocus>
    <button id="entrar" class="primary">Entrar</button>
    <div id="err"></div>
  </div>
<script>
  const pin = document.getElementById("pin");
  const btn = document.getElementById("entrar");
  const err = document.getElementById("err");

  async function entrar() {
    const v = pin.value.trim();
    if (!v) { pin.focus(); return; }
    btn.disabled = true;
    err.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: v }),
      });
      const d = await r.json();
      if (d.ok) { location.href = "/"; return; }
      err.textContent = d.error || "No se pudo entrar";
      pin.value = ""; pin.focus();
    } catch (e) {
      err.textContent = "Sin conexión con el programa";
    } finally {
      btn.disabled = false;
    }
  }
  btn.onclick = entrar;
  pin.addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
  pin.addEventListener("input", () => { if (pin.value.length === 6) entrar(); });
</script>
</body>
</html>
