<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Armador DTF</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="tab-designs">
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="currentColor"/><rect x="13" y="3" width="8" height="5" rx="2.5" fill="currentColor" opacity=".45"/><rect x="13" y="10" width="8" height="11" rx="2.5" fill="currentColor" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="currentColor" opacity=".25"/></svg>
    </span>
    <strong>Armador DTF</strong>
  </div>
  <div class="actions">
    <button id="btnInfo" class="secondary icon" title="Conectar celular / iPad">
      <svg viewBox="0 0 20 20" fill="none"><rect x="6" y="2.5" width="8" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M9 14.5h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button id="btnSettings" class="secondary icon only-mobile" title="Ajustes">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.7v2M10 15.3v2M17.3 10h-2M4.7 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button id="btnLiberar" class="secondary" title="Quitar todos los bloqueos">
      <svg viewBox="0 0 20 20" fill="none"><rect x="5" y="9" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 9V6.5a2.5 2.5 0 0 1 4.6-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="lbl">Liberar todo</span>
    </button>
    <button id="btnAcomodar" class="secondary" title="Reacomodar">
      <svg viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 0 1 10.2-4.24M16 10a6 6 0 0 1-10.2 4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 2.5V6h-3.5M6 17.5V14h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Reacomodar</span>
    </button>
    <button id="btnExportar" class="primary">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v9.5M10 12.5l-3.5-3.5M10 12.5l3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15.5v.8a1.7 1.7 0 0 0 1.7 1.7h8.6a1.7 1.7 0 0 0 1.7-1.7v-.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="lbl">Exportar plancha</span>
    </button>
  </div>
</header>

<nav id="tabbar" class="only-mobile">
  <button data-tab="designs" class="active">Diseños</button>
  <button data-tab="sheet">Plancha</button>
</nav>

<div class="layout">
  <aside id="sidebar">
    <div id="dropzone">
      <p><strong>Arrastra tus diseños aquí</strong></p>
      <p class="hint">PNG con transparencia (también TIFF, JPG)</p>
      <button id="btnBrowse" class="secondary">Elegir archivos…</button>
      <input type="file" id="fileInput" multiple accept="image/*,.tif,.tiff" hidden>
    </div>
    <div id="tableWrap">
      <table id="designTable">
        <thead>
          <tr><th></th><th>Archivo</th><th>Ancho</th><th>Alto</th><th>Cant.</th><th></th></tr>
        </thead>
        <tbody id="designRows"></tbody>
      </table>
      <div id="tableTotals"></div>
    </div>
  </aside>

  <main>
    <div id="settings">
      <label>Ancho útil <input type="number" id="setWidth" value="57" min="10" max="120" step="0.5" inputmode="decimal"> cm</label>
      <label>Separación <input type="number" id="setSpacing" value="0.5" min="0" max="5" step="0.1" inputmode="decimal"> cm</label>
      <label>Margen <input type="number" id="setMargin" value="0.5" min="0" max="5" step="0.1" inputmode="decimal"> cm</label>
      <label>DPI <input type="number" id="setDpi" value="300" min="150" max="720" step="10" inputmode="numeric"></label>
      <label title="Elimina bordes casi transparentes: en DTF esas zonas retienen poco polvo y se despegan">Limpiar bordes <input type="number" id="setThreshold" value="0" min="0" max="100" step="5" inputmode="numeric"> %</label>
      <label class="chk"><input type="checkbox" id="setRotate" checked> Girar 90°</label>
      <label class="chk" title="Solo si MainTop NO está espejeando ya la película"><input type="checkbox" id="setMirror"> Espejo</label>
      <label class="chk"><input type="checkbox" id="setConBlanco" checked> Canal White</label>
      <span id="whiteControls">
        <label title="Retira la base blanca del borde del arte. Déjalo en 0 si MainTop ya lo hace: contraer dos veces deja el color sin blanco debajo">Contraer blanco <input type="number" id="setChoke" value="1" min="0" max="6" step="1" inputmode="numeric"> px</label>
        <button id="btnWhite" class="secondary toggle" title="Ver dónde llevará tinta blanca">
          <svg viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Canal White</span>
        </button>
      </span>
      <span class="cmyk-only">
        <label>Color
          <select id="setIntent">
            <option value="perceptual" selected>Perceptual</option>
            <option value="relative">Colorimétrico relativo</option>
            <option value="saturation">Saturación</option>
          </select>
        </label>
      </span>
    </div>
    <div id="cmykWarn" class="warn hidden"></div>
    <div id="bordeWarn" class="warn hidden"></div>

    <div id="statusbar">
      <span id="statInfo">Agrega diseños para comenzar</span>
      <span id="statLen"></span>
    </div>

    <div id="previewWrap">
      <div id="sheet"></div>
    </div>
    <div class="preview-hint">Toca una pieza para seleccionarla · arrástrala para fijarla · ⟳ la gira</div>
  </main>
</div>

<div id="pieceTools" class="hidden">
  <button id="ptRotate" title="Girar 90°">
    <svg viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 0 1 10.2-4.24M16 10a6 6 0 0 1-10.2 4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 2.5V6h-3.5M6 17.5V14h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="ptRelease" title="Liberar esta pieza">
    <svg viewBox="0 0 20 20" fill="none"><rect x="5" y="9" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 9V6.5a2.5 2.5 0 0 1 4.6-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</div>

<div id="toast"></div>

<div id="modal" class="hidden">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="btnCarpeta" class="secondary">Abrir carpeta</button>
      <button id="btnCerrarModal" class="primary">Listo</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
